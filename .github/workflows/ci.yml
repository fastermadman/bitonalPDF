name: CI

# Lint + smoke test run on ubuntu (cheap); macOS minutes cost 10x, so macOS only builds the app
# (needs osacompile/codesign/plutil). PR-only, and superseded runs are cancelled.
# `check` is the required status check in the pr-flow ruleset.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr shellcheck
      # apt's ImageMagick is v6 (no `magick` command); Homebrew is preinstalled but not on PATH.
      - run: |
          /home/linuxbrew/.linuxbrew/bin/brew install imagemagick
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - run: shellcheck -e SC1090,SC2153 bitonalpdf.sh build.sh tests/smoke.sh tests/real.sh
      - run: tests/smoke.sh

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh

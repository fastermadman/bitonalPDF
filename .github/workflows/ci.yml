name: CI

# Lint + smoke test run on ubuntu (cheap); macOS minutes cost 10x, so macOS only builds the app
# (needs osacompile/codesign/plutil). PR-only, and superseded runs are cancelled.
# `check` is the required status check in the pr-flow ruleset.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr shellcheck
      # apt's ImageMagick is v6 (no `magick` command); Homebrew is preinstalled but not on PATH.
      - run: |
          /home/linuxbrew/.linuxbrew/bin/brew install imagemagick
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - run: shellcheck -e SC1090,SC2153 bitonalpdf.sh build.sh tests/smoke.sh tests/real.sh tests/synth.sh tests/measure.sh
      - run: tests/smoke.sh
      - run: tests/synth.sh
      - name: TEMP pre-fix comparison (remove)
        run: |
          for c in 7fa02c2 0d2b7a7; do git show $c:bitonalpdf.sh > /tmp/pre.sh; chmod +x /tmp/pre.sh; echo "== $c"; BIN=/tmp/pre.sh tests/synth.sh || true; done
          magick -version | head -1

  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh

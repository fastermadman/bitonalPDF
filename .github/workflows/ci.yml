name: CI

# macOS runner: the script uses BSD `stat` and build.sh needs osacompile/codesign.
# Public repo, so macOS minutes are free.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install poppler imagemagick shellcheck
      - run: shellcheck bitonalpdf.sh build.sh tests/smoke.sh
      - run: tests/smoke.sh
      - run: ./build.sh
